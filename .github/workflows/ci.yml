name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CI: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: actions/checkout v7.0.1 (full history, MinVer reads the version from the latest tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install gitleaks and shellcheck (pinned, checksum verified, in the runner's temp folder because the repository guards count every untracked file), so the gate never skips them
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          curl -sSfL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum --check
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: The gate (locked restore, build with warnings as errors, csharpier, tests, pack, shellcheck, gitleaks)
        run: bash tests/Suwbackkit.Gate/scripts/check.sh
      - name: Keep the packages (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  publish:
    needs: [check]
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget-org
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The packages the gate built and checked (actions/download-artifact v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packages
          path: packages
      - name: actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: A tag publishes its own release version only, never a pre-release built between tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          shopt -s nullglob
          packages=(packages/*.nupkg)
          [ "${#packages[@]}" -gt 0 ] || { echo "no .nupkg in the artifact" >&2; exit 1; }
          for package in "${packages[@]}"; do
            case "$package" in
              *."$version".nupkg) ;;
              *) echo "$package does not carry the tag's version $version: tag the commit as v<major>.<minor>.<patch> (MinVer)" >&2; exit 1 ;;
            esac
          done
      - name: NuGet trusted publishing, a short-lived API key for this run (NuGet/login v1.2.0)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the packages and their symbols to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
