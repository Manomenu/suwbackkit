name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"

jobs:
  gate:
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    uses: Manomenu/suwgate/.github/workflows/gate.yml@d65cfac87ac011edb06a12f4b02d6c3ea45f942a

  consumer:
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    uses: Manomenu/suwgate/.github/workflows/gate.yml@d65cfac87ac011edb06a12f4b02d6c3ea45f942a
    with:
      consumer: Manomenu/solid-dotnet-app-tpl
      package: nuget
      working-directory: Myapp.Web
      browser: chromium

  pack:
    needs: [gate, consumer]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: Manomenu/suwgate/.github/workflows/release-nuget.yml@d65cfac87ac011edb06a12f4b02d6c3ea45f942a
    with:
      pack-target: Suwbackkit.slnx

  publish:
    needs: [pack]
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: nuget-org
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The packages the pack job built (actions/download-artifact v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nupkg
          path: packages
      - name: actions/setup-dotnet v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: A tag publishes its own release version only, never a pre-release built between tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          shopt -s nullglob
          packages=(packages/*.nupkg)
          [ "${#packages[@]}" -gt 0 ] || { echo "no .nupkg in the artifact" >&2; exit 1; }
          for package in "${packages[@]}"; do
            case "$package" in
              *."$version".nupkg) ;;
              *) echo "$package does not carry the tag's version $version: tag the commit as v<major>.<minor>.<patch> (MinVer)" >&2; exit 1 ;;
            esac
          done
      - name: NuGet trusted publishing, a short-lived API key for this run (NuGet/login v1.2.0)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the packages and their symbols to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
